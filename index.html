<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>𝙱𝙾𝚃𝙰𝚃𝙾</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
  --bg-deep: #0c0a08;
  --wood: #1a140e;
  --panel: rgba(24, 20, 14, 0.82);
  --panel-hover: rgba(40, 32, 20, 0.92);
  --brass: #b8924a;
  --brass-bright: #e3c277;
  --brass-dim: #6e5628;
  --lamp: #ffb45a;
  --paper: #d9c9a3;
  --paper-dim: #a89a7a;
  --olive: #4a5236;
  --ink: #efe4c8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Courier Prime', 'Courier New', monospace;
  background: var(--bg-deep);
  color: var(--ink);
  overflow-x: hidden;
  line-height: 1.55;
  min-height: 100vh;
}

/* ---------- Backdrop: dim room, lamp light, rain ---------- */
.room {
  position: fixed; inset: 0; z-index: -4;
  background:
    radial-gradient(ellipse 70% 55% at 50% 18%, rgba(255, 170, 80, 0.20), transparent 70%),
    radial-gradient(ellipse at 50% 100%, #1b140c, #080605 70%);
}
.room::before {
  content: "";
  position: absolute; inset: 0;
  background: url('Main background.jpg') no-repeat center center / cover;
  opacity: 0.16;
  filter: sepia(0.9) saturate(0.8) brightness(0.7);
  mix-blend-mode: luminosity;
}
.lamp-glow {
  position: fixed; inset: 0; z-index: -3; pointer-events: none;
  background: radial-gradient(circle at 50% 12%, rgba(255, 190, 100, 0.22), transparent 55%);
  animation: lampFlicker 6s infinite;
}
@keyframes lampFlicker {
  0%, 100% { opacity: 0.95; }
  8% { opacity: 0.85; }
  10% { opacity: 1; }
  46% { opacity: 0.92; }
  50% { opacity: 0.8; }
  53% { opacity: 1; }
  80% { opacity: 0.93; }
}
#rain {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  width: 100%; height: 100%;
}
.flash {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: rgba(220, 215, 190, 0.5);
  opacity: 0;
}
.flash.go { animation: soften 1.3s ease-out; }
@keyframes soften {
  0% { opacity: 0.22; }
  12% { opacity: 0.05; }
  22% { opacity: 0.16; }
  100% { opacity: 0; }
}
.vignette {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.75) 100%);
}
.grain {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- Layout ---------- */
.container {
  position: relative; z-index: 2;
  max-width: 1000px; margin: 0 auto;
  padding: 0 1.5rem 7rem;
}

/* ---------- Brass-framed panel (RE4 menu look) ---------- */
.frame {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--brass-dim);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,0.5), inset 0 0 0 4px rgba(184, 146, 74, 0.25), 0 14px 30px -12px #000;
  backdrop-filter: blur(3px);
}
.frame::before, .frame::after {
  content: ""; position: absolute; width: 14px; height: 14px;
  border: 2px solid var(--brass);
  pointer-events: none;
}
.frame::before { top: -4px; left: -4px; border-right: 0; border-bottom: 0; }
.frame::after { bottom: -4px; right: -4px; border-left: 0; border-top: 0; }

/* ---------- Hero ---------- */
.hero {
  min-height: 88vh;
  display: flex; align-items: center; justify-content: center;
  padding-top: 2rem;
}
.hero-card {
  width: 100%; max-width: 520px;
  padding: 2.6rem 2rem 2.2rem;
  text-align: center;
  animation: enter 1.1s ease-out both;
}
@keyframes enter {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
.avatar-ring {
  width: 148px; height: 148px; margin: 0 auto 1.4rem;
  position: relative; border-radius: 50%;
  padding: 5px;
  background: conic-gradient(from 200deg, #6e5628, #e3c277, #6e5628, #b8924a, #6e5628);
  box-shadow: 0 0 26px rgba(255, 170, 70, 0.28), 0 10px 22px #000;
}
.avatar-bg-gif, .avatar-img {
  position: absolute; inset: 5px;
  width: calc(100% - 10px); height: calc(100% - 10px);
  border-radius: 50%; object-fit: cover;
}
.avatar-bg-gif { opacity: 0.9; filter: sepia(0.5) saturate(0.9); }
.avatar-img { background: #14100b; filter: sepia(0.2) contrast(1.05); }
.hero-card h1 {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 2.9rem;
  letter-spacing: 0.22em;
  padding-left: 0.22em;
  color: var(--brass-bright);
  text-shadow: 0 0 18px rgba(255, 170, 70, 0.35), 0 2px 0 #000;
}
.hero-rule {
  width: 120px; height: 1px; margin: 0.9rem auto;
  background: linear-gradient(90deg, transparent, var(--brass), transparent);
}
.hero-tagline {
  font-family: 'Special Elite', monospace;
  font-size: 1.05rem;
  color: var(--paper);
  min-height: 1.6em;
}
.hero-tagline .cursor {
  display: inline-block; width: 0.55em; height: 1.05em; margin-left: 3px;
  background: var(--lamp); vertical-align: -0.15em;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- Section headers ---------- */
.section-header { margin: 1rem 0 1.6rem; text-align: center; }
.section-header h2 {
  font-family: 'Cinzel', serif; font-weight: 600;
  font-size: 1.7rem; letter-spacing: 0.14em;
  color: var(--brass-bright);
  display: inline-flex; align-items: center; gap: 1rem;
}
.section-header h2::before, .section-header h2::after {
  content: ""; width: 48px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--brass));
}
.section-header h2::after { transform: scaleX(-1); }
.section-header p {
  font-family: 'Special Elite', monospace;
  color: var(--paper-dim); font-size: 0.85rem; margin-top: 0.35rem;
}

/* ---------- Accounts (inventory slots) ---------- */
.social-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.9rem;
  margin-bottom: 3.2rem;
}
.social-link {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.85rem 1.1rem;
  text-decoration: none; color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--brass-dim);
  border-left: 4px solid var(--olive);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.45);
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.2s;
}
.social-link:hover, .social-link:focus-visible {
  background: var(--panel-hover);
  border-color: var(--brass-bright);
  border-left-color: var(--lamp);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.45), 0 0 16px rgba(255, 170, 70, 0.22);
  transform: translateX(3px);
  outline: none;
}
.social-icon {
  width: 46px; height: 46px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 1.5rem; color: var(--brass-bright);
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--brass-dim);
}
.social-details h3 {
  font-family: 'Cinzel', serif; font-weight: 600;
  font-size: 1.05rem; letter-spacing: 0.06em;
}
.social-note {
  font-size: 0.78rem; color: var(--paper-dim);
  display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap;
}
.golden-badge { color: var(--brass-bright); }

/* ---------- Top V (typed file entries) ---------- */
.fav-grid { display: flex; flex-direction: column; gap: 1rem; }
.fav-card {
  display: flex; align-items: center; flex-wrap: wrap; gap: 1rem;
  padding: 0.9rem 1.1rem;
  background: var(--panel);
  border: 1px solid var(--brass-dim);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.45);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.fav-card:hover {
  border-color: var(--brass-bright);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.45), 0 0 18px rgba(255, 170, 70, 0.2);
}
.fav-rank {
  font-family: 'Cinzel', serif; font-weight: 700;
  font-size: 1.9rem; min-width: 56px; text-align: center;
  color: var(--brass-bright);
}
.anime-thumb {
  width: 76px; height: 76px; object-fit: cover; flex-shrink: 0;
  border: 2px solid var(--brass-dim);
  outline: 1px solid #000;
  filter: sepia(0.35) contrast(1.05) brightness(0.92);
  transition: filter 0.25s;
}
.fav-card:hover .anime-thumb { filter: sepia(0.1) contrast(1.05); }
.fav-info { flex: 2; min-width: 170px; }
.fav-info h3 {
  font-family: 'Cinzel', serif; font-weight: 600;
  font-size: 1.2rem; letter-spacing: 0.04em;
}
.fav-stats {
  display: flex; gap: 1rem; flex-wrap: wrap;
  margin-top: 3px; font-size: 0.78rem; color: var(--paper-dim);
}
.fav-stats i { margin-right: 5px; color: var(--brass); }
.rating-pill {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 7px; padding: 0.15rem 0.7rem;
  font-size: 0.78rem; color: var(--paper);
  background: rgba(74, 82, 54, 0.45);
  border: 1px solid rgba(110, 120, 80, 0.7);
}
.rating-pill i { color: var(--brass-bright); font-size: 0.7rem; }
.quote-vibe {
  margin-left: auto;
  font-family: 'Special Elite', monospace; font-size: 0.85rem;
  color: var(--paper-dim); white-space: nowrap;
}

footer {
  text-align: center; margin-top: 3.2rem; padding-top: 1.2rem;
  border-top: 1px solid var(--brass-dim);
  font-family: 'Special Elite', monospace;
  font-size: 0.85rem; color: var(--paper-dim);
}

/* ---------- Scroll reveal (kept calm) ---------- */
.reveal { opacity: 0; transition: opacity 0.9s ease; }
.reveal.revealed { opacity: 1; }

/* ---------- Music player ---------- */
.music-fixed-wrapper {
  position: fixed; bottom: 22px; left: 22px; z-index: 1000;
  display: flex; align-items: center; gap: 10px;
  max-width: calc(100vw - 44px);
}
.music-toggle-btn {
  width: 50px; height: 50px; flex-shrink: 0;
  display: grid; place-items: center; cursor: pointer;
  color: var(--brass-bright); font-size: 1.15rem;
  background: rgba(20, 16, 11, 0.94);
  border: 1px solid var(--brass);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5), 0 8px 18px #000;
  transition: background 0.2s, box-shadow 0.2s;
}
.music-toggle-btn:hover, .music-toggle-btn:focus-visible {
  background: rgba(46, 36, 20, 0.96);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5), 0 0 16px rgba(255,170,70,0.35);
  outline: none;
}
.music-float {
  background: rgba(20, 16, 11, 0.94);
  border: 1px solid var(--brass);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5), 0 14px 28px #000;
  transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
  min-width: 0;
}
.music-float.hidden {
  opacity: 0; transform: translateX(-24px);
  pointer-events: none; visibility: hidden;
}
.music-player-inner {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 16px 8px 10px; flex-wrap: wrap;
}
.player-avatar {
  width: 42px; height: 42px; flex-shrink: 0;
  display: grid; place-items: center;
  color: var(--lamp); font-size: 1.2rem;
  background: rgba(0,0,0,0.5); border: 1px solid var(--brass-dim);
}
.player-info { min-width: 110px; }
.track-name {
  font-family: 'Special Elite', monospace;
  font-size: 0.95rem; color: var(--brass-bright);
  white-space: nowrap;
}
.track-artist { font-size: 0.7rem; color: var(--paper-dim); }
.controls-group { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.player-controls { display: flex; gap: 6px; }
.ctrl-btn {
  width: 34px; height: 34px;
  display: inline-grid; place-items: center; cursor: pointer;
  color: var(--paper); font-size: 0.95rem;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--brass-dim);
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.ctrl-btn:hover, .ctrl-btn:focus-visible {
  color: var(--brass-bright); border-color: var(--brass-bright);
  background: rgba(60, 46, 24, 0.7); outline: none;
}
.ctrl-btn.active { color: var(--lamp); border-color: var(--lamp); }
.progress-area { display: flex; align-items: center; gap: 8px; }
.time-current, .time-duration { font-size: 0.72rem; color: var(--paper-dim); min-width: 34px; text-align: center; }
.progress-bar-bg {
  width: 120px; height: 6px; cursor: pointer;
  background: rgba(0,0,0,0.6); border: 1px solid var(--brass-dim);
}
.progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--brass-dim), var(--lamp)); }
.volume-inline { display: flex; align-items: center; gap: 7px; color: var(--brass); font-size: 0.85rem; }
.volume-slider-compact {
  -webkit-appearance: none; appearance: none;
  width: 80px; height: 5px; cursor: pointer;
  background: rgba(0,0,0,0.6); border: 1px solid var(--brass-dim);
}
.volume-slider-compact::-webkit-slider-thumb {
  -webkit-appearance: none; width: 11px; height: 15px;
  background: var(--brass-bright); border: 1px solid #000;
}
.volume-slider-compact::-moz-range-thumb {
  width: 11px; height: 15px; border-radius: 0;
  background: var(--brass-bright); border: 1px solid #000;
}

/* ---------- "Game saved" toast ---------- */
.welcome-toast {
  position: fixed; top: 22px; left: 50%; z-index: 2000;
  transform: translate(-50%, -90px);
  display: flex; align-items: center; gap: 12px;
  padding: 0.7rem 1.4rem;
  background: rgba(20, 16, 11, 0.95);
  border: 1px solid var(--brass);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5), 0 12px 24px #000;
  font-family: 'Special Elite', monospace; color: var(--paper);
  transition: transform 0.5s ease, opacity 0.4s ease;
  opacity: 0; pointer-events: none; white-space: nowrap;
}
.welcome-toast.show { transform: translate(-50%, 0); opacity: 1; }
.welcome-toast i { color: var(--lamp); }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #0c0a08; }
::-webkit-scrollbar-thumb { background: var(--brass-dim); border: 1px solid #000; }

/* ---------- Responsive ---------- */
@media (max-width: 780px) {
  .container { padding: 0 1rem 7rem; }
  .hero { min-height: 78vh; }
  .hero-card h1 { font-size: 2.1rem; letter-spacing: 0.16em; }
  .avatar-ring { width: 124px; height: 124px; }
  .music-fixed-wrapper { bottom: 14px; left: 14px; }
  .music-player-inner { gap: 8px; padding: 6px 10px 6px 8px; }
  .player-info { min-width: 0; }
  .track-name { font-size: 0.8rem; }
  .progress-bar-bg { width: 70px; }
  .volume-inline { display: none; }
  .quote-vibe { margin-left: 0; width: 100%; white-space: normal; }
  .section-header h2 { font-size: 1.3rem; }
  .section-header h2::before, .section-header h2::after { width: 22px; }
}
@media (max-width: 480px) {
  .fav-card { flex-direction: column; text-align: center; }
  .fav-stats { justify-content: center; }
  .welcome-toast { white-space: normal; width: 88vw; font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  .lamp-glow, .hero-card, .flash.go, .hero-tagline .cursor { animation: none !important; }
  .reveal { opacity: 1; transition: none; }
}
</style>
</head>
<body>

<div class="room"></div>
<div class="lamp-glow"></div>
<canvas id="rain"></canvas>
<div class="flash" id="flash"></div>
<div class="vignette"></div>
<div class="grain"></div>

<div class="container">

  <div class="hero">
    <div class="hero-card frame">
      <div class="avatar-ring">
        <img class="avatar-bg-gif" src="profile background.gif" alt="" loading="eager">
        <img class="avatar-img" src="profile.jpg" alt="Botato" loading="eager">
      </div>
      <h1>BOTATO</h1>
      <div class="hero-rule"></div>
      <div class="hero-tagline" id="tagline" aria-label="Welcome, stranger."></div>
    </div>
  </div>

  <div class="section-header reveal">
    <h2>My Accounts</h2>
    <p>Where to find me</p>
  </div>
  <div class="social-grid" id="socialGrid"></div>

  <div class="section-header reveal">
    <h2>Top V</h2>
    <p>Files worth keeping</p>
  </div>
  <div class="fav-grid" id="favoritesList"></div>

  <footer class="reveal">
    <i class="fas fa-floppy-disk"></i> Created by 𝙱𝙾𝚃𝙰𝚃𝙾
  </footer>
</div>

<div class="music-fixed-wrapper">
  <div class="music-toggle-btn" id="musicToggleBtn" role="button" tabindex="0" aria-label="Open music player">
    <i class="fas fa-chevron-right" id="toggleIcon"></i>
  </div>
  <div class="music-float hidden" id="floatingMusicPlayer">
    <div class="music-player-inner">
      <div class="player-avatar"><i class="fas fa-music"></i></div>
      <div class="player-info">
        <div class="track-name" id="trackName">Save Room</div>
        <div class="track-artist">Resident Evil 4 · Classic</div>
      </div>
      <div class="controls-group">
        <div class="player-controls">
          <button class="ctrl-btn" id="playPauseBtn" aria-label="Play or pause"><i class="fas fa-play"></i></button>
          <button class="ctrl-btn" id="stopResetBtn" aria-label="Stop"><i class="fas fa-stop"></i></button>
        </div>
        <div class="progress-area">
          <span class="time-current" id="currentTime">0:00</span>
          <div class="progress-bar-bg" id="progressBarBg"><div class="progress-fill" id="progressFill"></div></div>
          <span class="time-duration" id="durationTime">0:00</span>
        </div>
        <div class="volume-inline"><i class="fas fa-volume-up"></i><input type="range" id="volumeSliderCompact" class="volume-slider-compact" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div>
      </div>
    </div>
  </div>
</div>

<div id="welcomeToast" class="welcome-toast">
  <i class="fas fa-floppy-disk"></i>
  <span>! Welcome !</span>
</div>

<script>

  { name: "Demon Slayer", rank: 2, genre: "Action · Supernatural", vibe: "emotional", rating: "8.9", comment: "boundless heart", image: "https://i.pinimg.com/1200x/05/a8/57/05a85759e1320870c98b98bda1f46a2d.jpg" },
  { name: "Vinland Saga", rank: 3, genre: "Historical · Seinen", vibe: "philosophical", rating: "9.0", comment: "a true warrior", image: "https://i.pinimg.com/1200x/13/7a/ae/137aae582bd8f0435424990b4894efa3.jpg" },
  { name: "Hunter x Hunter", rank: 4, genre: "Adventure · Shonen", vibe: "masterpiece", rating: "9.1", comment: "endless journey", image: "https://i.pinimg.com/736x/f8/a8/2d/f8a82dd2c77c75391252f7f5c6b128f2.jpg" },
  { name: "Death Note", rank: 5, genre: "Psychological · Thriller", vibe: "intense", rating: "9.0", comment: "moral maze", image: "https://i.pinimg.com/1200x/e9/1e/60/e91e60c64556eda64322ae485e1bccd5.jpg" }

/* ================= BUILD CONTENT ================= */

socialAccounts.forEach(acc => {

  link.target = "_blank";

  if (acc.goldenNote) notes += `<span class="social-note golden-badge"><i class="fas fa-crown"></i> ${acc.goldenNote}</span>`;
  link.innerHTML = `<div class="social-icon"><i class="${acc.icon}"></i></div><div class="social-details"><h3>${acc.name}</h3>${notes}</div>`;

const favoritesContainer = document.getElementById('favoritesList');
animeFavorites.forEach(anime => {

/* Gentle fade-in on scroll */
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('revealed'); revealObserver.unobserve(e.target); } });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

/* ================= TYPEWRITER TAGLINE ================= */
(function typeTagline() {
  const el = document.getElementById('tagline');
  const text = "Welcome, stranger.";
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { el.textContent = text; return; }
  let i = 0;
  el.innerHTML = '<span id="typed"></span><span class="cursor"></span>';
  const typed = document.getElementById('typed');
  setTimeout(function tick() {
    typed.textContent = text.slice(0, ++i);
    if (i < text.length) setTimeout(tick, 70 + Math.random() * 90);
  }, 900);
})();

/* ================= HEAVY RAIN (canvas) ================= */
(function rain() {
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, drops = [], splashes = [];
  const WIND = 0.22;               // slant of the rain

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    w = canvas.width = Math.floor(window.innerWidth * dpr);
    h = canvas.height = Math.floor(window.innerHeight * dpr);
    const count = Math.min(900, Math.floor((window.innerWidth * window.innerHeight) / 1800));
    drops = Array.from({ length: reduce ? Math.floor(count / 3) : count }, makeDrop);
  }
  function makeDrop() {
    const depth = Math.random();                 // 0 far → 1 near
    return {
      x: Math.random() * (w + h * WIND + 100) - h * WIND,
      y: Math.random() * h,
      len: (10 + depth * 26) * dpr,
      speed: (11 + depth * 17) * dpr,
      alpha: 0.12 + depth * 0.35,
      width: (0.6 + depth * 1.1) * dpr,
      depth
    };
  }
  function frame() {
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round';
    for (const d of drops) {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(190, 205, 215, ${d.alpha})`;
      ctx.lineWidth = d.width;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.len * WIND, d.y - d.len);
      ctx.stroke();
      d.y += d.speed;
      d.x += d.speed * WIND;
      if (d.y - d.len > h) {
        if (d.depth > 0.55 && Math.random() < 0.55 && splashes.length < 160) {
          splashes.push({ x: d.x, y: h - Math.random() * 14 * dpr, r: 1 * dpr, a: 0.4 });
        }
        d.y = -d.len;
        d.x = Math.random() * (w + h * WIND + 100) - h * WIND;
      }
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      ctx.beginPath();
      ctx.strokeStyle = `rgba(190, 205, 215, ${s.a})`;
      ctx.lineWidth = dpr;
      ctx.ellipse(s.x, s.y, s.r * 2.2, s.r, 0, 0, Math.PI * 2);
      ctx.stroke();
      s.r += 0.5 * dpr; s.a -= 0.03;
      if (s.a <= 0) splashes.splice(i, 1);
    }
    requestAnimationFrame(frame);
  }
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);

  /* soft, distant lightning glow every so often */
  if (!reduce) {
    const flash = document.getElementById('flash');
    (function schedule() {
      setTimeout(() => {
        flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
        schedule();
      }, 14000 + Math.random() * 16000);
    })();
  }
})();

/* ================= MUSIC PLAYER ================= */
(function player() {
  const audio = new Audio('music.mp3');   // ← replace this file with your RE4 save room track
  audio.loop = true;
  audio.volume = 0.7;
  audio.preload = 'auto';

  const wrapperBtn = document.getElementById('musicToggleBtn');
  const panel = document.getElementById('floatingMusicPlayer');
  const toggleIcon = document.getElementById('toggleIcon');
  const playBtn = document.getElementById('playPauseBtn');
  const stopBtn = document.getElementById('stopResetBtn');
  const cur = document.getElementById('currentTime');
  const dur = document.getElementById('durationTime');
  const bar = document.getElementById('progressBarBg');
  const fill = document.getElementById('progressFill');
  const vol = document.getElementById('volumeSliderCompact');
  let userPaused = false;

  const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
  const setPlayIcon = playing => { playBtn.innerHTML = playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>'; };

  function openPanel(open) {
    panel.classList.toggle('hidden', !open);
    toggleIcon.className = open ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
    wrapperBtn.setAttribute('aria-label', open ? 'Close music player' : 'Open music player');
  }
  let isOpen = false;
  const toggle = () => { isOpen = !isOpen; openPanel(isOpen); };
  wrapperBtn.addEventListener('click', toggle);
  wrapperBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

  function play() { return audio.play().then(() => setPlayIcon(true)).catch(() => setPlayIcon(false)); }

  playBtn.addEventListener('click', () => {
    if (audio.paused) { userPaused = false; play(); } else { userPaused = true; audio.pause(); setPlayIcon(false); }
  });
  stopBtn.addEventListener('click', () => { userPaused = true; audio.pause(); audio.currentTime = 0; setPlayIcon(false); });

  audio.addEventListener('loadedmetadata', () => { dur.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', () => {
    cur.textContent = fmt(audio.currentTime);
    if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  });
  bar.addEventListener('click', e => {
    const r = bar.getBoundingClientRect();
    if (audio.duration) audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });
  vol.addEventListener('input', () => { audio.volume = parseFloat(vol.value); });

  /* Try to start on load; browsers usually require a first tap/click */
  play();
  const firstInteraction = () => {
    if (!userPaused && audio.paused) play();
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.removeEventListener(ev, firstInteraction));
  };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, firstInteraction, { once: false }));
})();
